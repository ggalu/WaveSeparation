# Single source of truth for both simulators and for the analysis scripts.
#
# Units throughout: mm, ms, kg  =>  kN, GPa, and mm/ms (numerically m/s).
#
# Four cases are defined. They are independent -- different materials, different
# geometry, and their own gauge locations. Pick one by running its driver:
#
#   python3 drive_compression.py             -> [compression], direct-impact bar
#   python3 drive_calibration_compression.py -> [calibration_compression], that
#                                               rig's two bars struck face to
#                                               face, NO specimen
#   python3 drive_tension.py                 -> [tension], SHTB, POM striker
#   python3 drive_calibration_tension.py     -> [calibration_tension], the SHTB
#                                               bars bolted together, no specimen
#
# All four write the same dump.npz, so the last one run is what the analysis
# scripts see. Never run a simulate_*.py directly: it produces no dump.
#
# Every case carries [<case>.input_bar] and [<case>.output_bar], even where the
# two bars are the same -- dump.npz records E / A / rho / c0 per bar, so nothing
# downstream has to ask whether a given rig happens to be symmetric.

# --------------------------------------------------------------------------
# Numerics, shared by both cases. Either case may override any of these in its
# own [<case>.numerics] table.
# --------------------------------------------------------------------------
[numerics]
# dt = courant * dx / c_max, with c_max over all materials present.
#
# A LARGER courant is both faster and more accurate here, which is worth knowing
# before anyone "improves" it downwards. The lumped chain is exactly
# non-dispersive at courant = 1.0, so raising it reduces phase error rather than
# adding any. The ceiling is not 1.0 in general: the tension model's contact
# spring adds a second force path at the anvil node and diverges to NaN there,
# while staying stable to ~0.95. 0.8 keeps a 20 % margin, costs 1.6x fewer steps
# than 0.5, and measures 24 % better on stress.
# See "Accuracy and time integration" in README.md for the full error budget.
courant = 0.8
damping = 0.01          # artificial viscosity coefficient; matters MORE than the
                        # integrator -- halving it doubles the stress error
ncyc = 3                # wave round-trips simulated; 3 keeps FFT truncation
                        # out of the analysis window (2 is visibly worse)
dx = 1.0                # element length [mm]

# Opt-in: also store strain and force for EVERY element at EVERY timestep.
# This is what the code used to do unconditionally, and it is expensive --
# the tension case is 6030 x 23038 at the shipped courant = 0.8, i.e. 2.2 GB in
# memory and 1.1 GB on disk. (The 6030 x 36861 / 3.6 GB / 1.8 GB quoted here
# until 2026-08-16 was measured back when courant was 0.5.)
# Leave false unless you need the full field (animation, Lagrange diagram).
record_full_field = false

# --------------------------------------------------------------------------
# Analysis parameters, read by the reduction scripts rather than the simulators
# --------------------------------------------------------------------------
[analysis]
# Exponential-window (Laplace) damping for separate(), units 1/ms. Stress is
# nearly insensitive to it; strain is not, because it is integrated. Tune on
# the strain. See the regularisation notes in wave_separation.py.
eta = 1.0

# ==========================================================================
# COMPRESSION: 1D direct-impact bar (simulate_compression.py)
# A moving input bar strikes a specimen resting against a stationary output bar.
# ==========================================================================
[compression]
loading = "compression"
gauges = [130.0, 530.0]           # gauge distance from the interface [mm]

# The two bars are separate tables because they are no longer the same bar.
# Everything downstream that says "the bar" means the INPUT bar: the dump's
# E / A / rho / c0 are written from [compression.input_bar].
[compression.input_bar]           # aluminium
E = 70.0
rho = 2.7e-6
diameter = 16.0
L_input = 2000.0
initial_velocity = 10.0           # the input bar arrives at this speed

# Polycarbonate output bar: the standard trick for a soft specimen. Its
# impedance rho*c is 0.12x the aluminium's, so the transmitted signal is ~8x
# larger for the same specimen force and does not disappear into the noise.
# c = sqrt(E/rho) = 1384 mm/ms, a quarter of the aluminium's 5092.
#
# It is SHORT on purpose. A PC bar long enough to time-separate the pulses
# would be absurd, so 1000 mm is what a real rig looks like -- and separating
# the overlapped waves is what this code is for.
[compression.output_bar]          # polycarbonate
E = 2.3
rho = 1.2e-6
diameter = 16.0
L_output = 1000.0

[compression.specimen]
diameter = 3.0
length = 4.0
E = 2.4
JC_A = 0.06                       # Johnson-Cook A
JC_B = 0.16                       # Johnson-Cook B
JC_n = 0.3                        # Johnson-Cook n
elastic_only = false              # true disables the specimen's plasticity

# ==========================================================================
# CALIBRATION (COMPRESSION): the two bars struck face to face, NO specimen.
# Run through simulate_compression.py by drive_calibration_compression.py, and
# analysed by identify_bar_compression.py -- see "Calibrating a direct-impact
# bar" in README.md.
#
# The tension rig needs a threaded coupler to join its bars; this one needs
# nothing. The input bar simply arrives at the output bar face and the two
# touch, so `specimen.length = 0` is literal rather than a stand-in, and the
# contact plane is a single unilateral face rather than the two a loose
# specimen has.
#
# It is EASIER to read than the tension calibration, and for one reason: both
# far ends are genuinely free. Each bar therefore rings on its own round trip
# 2 L / c, that round trip appears directly in the record, and the length that
# closes the scale is the BAR'S OWN LENGTH rather than a gauge-to-free-end
# distance nobody can reach with a tape. One per bar, because the two bars are
# different materials with different wave speeds and are acoustically
# independent once they separate.
# ==========================================================================
[calibration_compression]
loading = "compression"
gauges = [130.0, 530.0]           # the layout being calibrated. The identify
                                  # script is never told these and recovers them

# THE two measured lengths, one per bar: each bar's struck face to its own free
# end, which is just the bar's length. A strain record is invariant under
# (all lengths, c) -> (lambda * lengths, lambda * c) SEPARATELY ON EACH BAR
# here, so each bar needs exactly one length from outside and neither helps the
# other.
#
# Compare the tension rig, which needs L_free_ref -- a gauge-to-free-end
# distance, awkward because the gauge is a grid under a blob of adhesive. These
# are bar lengths. You measure them once, with the bars on the bench, before
# anything is glued to them.
#
# Omit both and identify_bar_compression.py falls back to the model's own
# geometry, which a simulation can supply and a rig cannot -- that is the
# self-check mode, not the instrument. Override on the command line with
# --l-in-ref / --l-out-ref to sweep sensitivity without editing this file.
L_free_in_ref = 2000.0            # input bar: struck face -> free end [mm]
L_free_out_ref = 1000.0           # output bar: struck face -> free end [mm]
L_free_ref_tol = 2.0              # what the tape is good to [mm], both bars

# Free-end null test, as in [calibration_tension] -- but here it runs on BOTH
# bars, because both far ends are free. See that case for why the window is not
# optional.
null_window = 0.75

# ONE THRESHOLD PER BAR, and they are 10-40x looser than the tension rig's
# 2.5e-3. That is not slack: it is where the floor actually is here. A direct
# impact starts from a VELOCITY STEP, so the wavefront is a discontinuity and
# carries every frequency the mesh has; the lumped chain disperses the high
# ones, the wake differs between two gauges 400 mm apart, and `separate` -- one
# uniform non-dispersive bar -- cannot fit both at once. The SHTB is spared
# because its POM striker gives a smooth 59 us rise.
#
# Measured with EXACT positions and c0, so this is the model's floor and not an
# identification error (refining the mesh moves it: 1.07e-2 -> 7.6e-3 at dx =
# 0.25 on the input bar, converging slowly):
#
#            floor    +1 % transit-time error    threshold below
#   input    1.07e-2  5.93e-2                    3.5e-2   (5.5x discrimination)
#   output   3.26e-2  7.65e-2                    1.0e-1   (2.3x)
#
# The polycarbonate bar is the weaker screen of the two -- 2.3x, about what the
# tension rig gets against a mismatched coupler. Treat a FAIL as conclusive and
# a PASS as weak evidence, and re-measure both floors on your own rig with
# known-good numbers rather than trusting these.
null_tol_in = 3.5e-2
null_tol_out = 1.0e-1

[calibration_compression.numerics]
ncyc = 6                          # ~6 input-bar and ~3 output-bar round trips,
                                  # so every echo used below is in the record

[calibration_compression.input_bar]     # same bars as [compression]
E = 70.0
rho = 2.7e-6
diameter = 16.0
L_input = 2000.0
initial_velocity = 10.0

[calibration_compression.output_bar]    # polycarbonate, as in [compression]
E = 2.3
rho = 1.2e-6
diameter = 16.0
L_output = 1000.0

[calibration_compression.specimen]
# NO SPECIMEN. Zero is literal: the mesh puts no element between the bars, the
# two interface planes coincide on the contact plane, and the unilateral
# condition is the single face where the bars actually touch. Every other
# specimen key is meaningless at zero length and may be omitted.
length = 0.0

# ==========================================================================
# TENSION: Split Hopkinson tension bar (simulate_tension.py)
# A hollow POM striker rides on the input bar, is launched away from the
# specimen, and strikes a steel anvil at the bar's far end.
# ==========================================================================
[tension]
loading = "tension"
gauges = [130.0, 530.0]

# The two bars are IDENTICAL here -- this is a conventional symmetric SHTB.
# They are still written as two tables because every case has the same shape:
# config.bar_lengths() and dump.npz's per-bar E / A / rho / c0 do not want to
# know whether a given rig happens to use the same stock on both sides.
# Keep the two in step unless you mean not to.
[tension.input_bar]               # 7075-T6 aluminium
E = 71.7
rho = 2.81e-6
diameter = 16.0
L_input = 3000.0

[tension.output_bar]              # 7075-T6 aluminium, the same bar
E = 71.7
rho = 2.81e-6
diameter = 16.0
L_output = 3000.0

[tension.striker]                 # POM (polyoxymethylene / acetal) tube
E = 3.0
rho = 1.41e-6
inner_diameter = 16.1             # clearance fit over the 16 mm bar
outer_diameter = 40.0
length = 800.0                    # sets the pulse length, 2*L/c_striker.
                                  # POM is 3.5x slower than aluminium, so
                                  # 800 mm gives 1097 us, not 314 us.
velocity = 10.0                   # toward the anvil, away from the specimen

[tension.anvil]                   # steel disc, rigidly attached to the input bar
E = 210.0
rho = 7.85e-6
diameter = 40.0
length = 20.0

[tension.specimen]
diameter = 5.0
length = 10.0
E = 2.4
rho = 2.81e-6                     # only the specimen's inertia depends on this,
                                  # and it is short: assume the bar alloy
JC_A = 0.06
JC_B = 0.16
JC_n = 0.3
# failure_strain = 0.5            # plastic strain at failure; omit to disable

# ==========================================================================
# CALIBRATION: the two bars bolted straight together, NO specimen.
# Run through simulate_tension.py by drive_calibration_tension.py, and analysed
# by identify_bar_tension.py, which recovers the gauge positions and c0 from the
# echo train alone -- see "Calibrating the bar from a connected-bar shot" in
# README.md. The "specimen" here is the real 150 mm threaded COUPLER, in bar
# material, so the joint is acoustically invisible and the assembly is a single
# uniform bar 150 mm longer than the two bars.
#
# Only two things differ from [tension], and the striker is NOT one of them:
#   * the specimen is replaced by the coupler, in bar material, which is the
#     whole point;
#   * ncyc raised, so the record holds several assembly round trips.
# The 800 mm striker is kept deliberately -- a calibration you can only run with
# a striker bought for the purpose is not a calibration you will run.
# ==========================================================================
[calibration_tension]
loading = "tension"
gauges = [130.0, 530.0]           # the layout being calibrated. The identify
                                  # script is never told these and recovers them

# THE one measured length. A strain record is invariant under
# (all lengths, c0) -> (lambda * all lengths, lambda * c0), so the shot fixes
# the geometry only up to one overall scale and exactly one length must come
# from outside. This is it: gauge -> far free end, by tape.
#
# It is a DISTANCE in mm, the same family as the dump's L_free_in / L_free_out
# but measured to a gauge rather than to a bar face. It has nothing to do with
# the complex wavenumber xi = (w - i eta)/c_p of the separation theory, which is
# a different quantity in different units -- these keys were called xi_ref* up
# to 2026-08-16 and that collision is why they are not any more.
#
# Omit L_free_ref entirely and identify_bar_tension.py falls back to the model's
# own geometry, which a simulation can supply and a rig cannot -- that is the
# self-check mode, not the instrument. Override either value on the command line
# (--l-free-ref / --l-free-ref-tol) to sweep sensitivity without editing this
# file.
#
# NOTE this value depends on the gauge layout and the bar lengths above. Change
# either and it goes stale; the script cross-checks it against the model
# geometry and warns when the two disagree by more than L_free_ref_tol.
L_free_ref = 3679.5               # in-1 -> far free end [mm]
L_free_ref_gauge = "in-1"         # which gauge the tape reached. Any gauge will
                                  # do -- the script refers it to whichever one
                                  # the record picks as reference -- but the
                                  # longest baseline gives the best leverage.
                                  # Omit to mean "whichever is the reference".
L_free_ref_tol = 2.0              # what the tape is actually good to [mm].
                                  # Propagated to every result; it dominates.

# Free-end null test. The far end of the output bar is a free surface, so the
# stress there is zero and the two separated waves must cancel. It is the only
# check in identify_bar_tension.py that consults no ground truth, so it is the
# only one that still works on a rig.
null_window = 0.75                # fraction of the record to keep. The tail MUST
                                  # be cut: the exponential window amplifies the
                                  # record-end truncation and inflates the
                                  # residual ~100x on a calibration that is good.
null_tol = 2.5e-3                 # pass threshold on the rms residual. Measured:
                                  #   7.9e-4  floor, exact inputs (dispersion)
                                  #   1.2e-3  a good identification
                                  #   3.5e-3  150 mm coupler at 0.9 rho
                                  #   2.6e-2  a 1 % uniform transit-time error
                                  # i.e. ~3x the floor, which separates good from
                                  # the mismatched coupler by only 2.9x. This is
                                  # a coarse screen, not a precision check. On a
                                  # real bar Pochhammer-Chree dispersion raises
                                  # the floor: measure it with known-good numbers
                                  # and set this to ~3x what you get.

[calibration_tension.numerics]
ncyc = 8                          # ~4 round trips of the 6150 mm assembly

# Same bars as [tension], and here they MUST match each other: the whole
# identification models the bolted-together assembly as ONE uniform bar, and
# identify_bar_tension.py refuses to run if these two tables disagree.
[calibration_tension.input_bar]
E = 71.7
rho = 2.81e-6
diameter = 16.0
L_input = 3000.0

[calibration_tension.output_bar]
E = 71.7
rho = 2.81e-6
diameter = 16.0
L_output = 3000.0

[calibration_tension.striker]     # the SAME 800 mm striker as [tension]:
E = 3.0                           # the calibration must run on the rig as
rho = 1.41e-6                     # it is, not on a striker bought for it.
inner_diameter = 16.1             # 2*L/c = 1097 us against a 2376 us round
outer_diameter = 40.0             # trip, so echoes OVERLAP and the analysis
length = 800.0                    # times edges rather than whole pulses.
velocity = 10.0

[calibration_tension.anvil]
E = 210.0
rho = 7.85e-6
diameter = 40.0
length = 20.0

[calibration_tension.specimen]    # the threaded coupler: bar material and bar
diameter = 16.0                   # diameter, so acoustically it is not there
length = 150.0                    # the real coupler length. Must be RIGHT: any
                                  # impedance step here biases the whole
                                  # identification in proportion to
                                  # length*(1/c_bar - 1/c_joint) -- see
                                  # "What a mismatched coupler costs" in README.
E = 71.7                          # bar material: the threads impose a small
rho = 2.81e-6                     # impedance change, deliberately neglected
JC_A = 1.0e3                      # yield stress far above anything reachable,
JC_B = 0.0                        # so the joint stays elastic and linear
JC_n = 1.0

# ==========================================================================
# EXPERIMENT: a MEASURED shot, not a simulated one.
#
# Everything above describes a model to be integrated. This describes a file to
# be read. There is no mesh, no striker table and no material to step forward --
# the bar already did that -- so config.py validates this family through
# _validate_experiment() and skips the simulator's checks.
#
#   python3 identify_bar_compression.py --experiment experiment_pc_bar
#   python3 identify_attenuation.py
#   python3 reconstruct_interface.py
#
# THE ONE THING TO UNDERSTAND ABOUT THIS CASE: the file holds FORCE in kN, not
# strain. That is fine and nothing has to convert it. `separate` is linear and
# takes "strain, or any quantity proportional to it -- force, volts", so P and M
# come back in kN and F = P + M is the interface force directly. E and A never
# enter the reconstruction at all; only c, the positions and eta do.
# ==========================================================================
[experiment_pc_bar]
loading = "compression"           # compression POSITIVE in this file, unlike
                                  # the simulators' compression-negative strain
file = "data/PC_bar_calibration.txt"

# TAPE positions of the two gauges, from the impact face. The identification is
# NEVER told these -- it recovers them, and reconstruct_interface.py then runs
# the reconstruction with both sets side by side so the difference is measured
# rather than assumed.
gauges = [118.0, 489.0]

# THE measured length: the output bar, impact face -> free end. One bar is
# instrumented, so one length closes the scale degeneracy
# (lengths, c) -> (lambda lengths, lambda c). The input bar has no gauge and is
# not identified; only its own c falls out, from the striker pulse length.
L_free_out_ref = 1027.0
L_free_ref_tol = 2.0

# The input bar, which is also the striker: 2415 mm of 7075 aluminium fired
# straight at the output bar's face. Not instrumented. Its length is here only
# so that c_in = 2 L / P can be reported from the measured pulse length P.
L_free_in_ref = 2415.0

# Column indices, 0-based. The file's 4th column is the average of the two and
# is deliberately not named here.
[experiment_pc_bar.columns]
time = 0                          # microseconds; the loader converts to ms
"out-0" = 1                       # force [kN] at the gauge nearer the impact
"out-1" = 2

[experiment_pc_bar.bar]
length = 1027.0                   # the instrumented (output) bar [mm]
diameter = 16.7
rho = 1.2e-6                      # polycarbonate [kg/mm^3]. NOT identifiable
                                  # from the record -- it is here to close
                                  # E = rho c^2, which is a by-product and not
                                  # a measurement. Weighing the bar is what
                                  # would actually close it.

[experiment_pc_bar.trim]
# `separate` needs the signals quiescent at t[0], and the raw file carries
# 1638 us of pre-trigger baseline before the shot. The loader finds the first
# arrival, keeps `lead` microseconds ahead of it and re-zeros t.
threshold = 0.05                  # fraction of peak that counts as "arrived"
lead = 50.0                       # us of quiet kept ahead of the arrival
baseline = true                   # subtract each channel's pre-trigger mean

[experiment_pc_bar.attenuation]
# Polycarbonate is VISCOELASTIC and this is the case that needs it. Band over
# which alpha(f) is fitted from the two-gauge spectral ratio. f_hi is also the
# BAND LIMIT: identify_attenuation.py emits an (freq, alpha) table ending here,
# and np.interp holds that last value above it, so the de-attenuation stops
# growing. Raising f_hi past where the record has energy buys nothing and
# amplifies noise -- see `attenuation` in wave_separation.separate.
f_lo = 2.0                        # kHz
f_hi = 50.0                       # kHz
snr = 0.01                        # keep bins whose |F1| is above this fraction
                                  # of the spectral peak

[experiment_pc_bar.null]
# Free-end null test, as in the calibration cases. The floor here is set by how
# well the viscoelastic model fits, not by a mesh, so it must be re-measured
# rather than inherited from [calibration_compression]. Measured on this record:
#   elastic (alpha = 0)          8.96e-2
#   alpha = 5.65e-5 f, capped    4.83e-2
window = 0.75
tol = 6.0e-2
